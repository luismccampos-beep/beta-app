name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'data/**'
      - 'public/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'data/**'
      - 'public/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://placeholder:placeholder@localhost:5432/placeholder' }}
  DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED || secrets.DATABASE_URL || 'postgresql://placeholder:placeholder@localhost:5432/placeholder' }}
  AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'test-secret-for-ci-only' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate --schema=packages/db/prisma/schema.prisma
      - name: ESLint
        run: npm run lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate --schema=packages/db/prisma/schema.prisma
      - name: TypeScript
        run: npm run type-check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate --schema=packages/db/prisma/schema.prisma
      - name: Run tests
        run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, type-check, test]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate --schema=packages/db/prisma/schema.prisma
      - name: Build
        run: npm run build -w @akmleva/web-tanstack
      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: build-output
          path: apps/web-tanstack/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: akmleva_e2e
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d akmleva_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/akmleva_e2e
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5433/akmleva_e2e
      AUTH_SECRET: test-secret-for-ci-only
      INTERNAL_API_KEY: test-internal-api-key
      CI: 'true'
      E2E_BYPASS_AUTH: 'true'

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate --schema=packages/db/prisma/schema.prisma
      - name: Apply database migrations
        run: npx prisma migrate deploy --schema=packages/db/prisma/schema.prisma
      - name: Download build
        uses: actions/download-artifact@v5
        with:
          name: build-output
          path: apps/web-tanstack/dist
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Start preview server
        shell: bash
        run: |
          npm run preview -w @akmleva/web-tanstack -- --port 3002 > /tmp/akmleva-tanstack.log 2>&1 &

          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3002 > /dev/null 2>&1; then
              echo "Preview server is ready"
              exit 0
            fi
            sleep 1
          done

          echo "Preview server failed to start"
          cat /tmp/akmleva-tanstack.log
          exit 1
      - name: Run E2E tests
        run: npm run e2e -w @akmleva/web-tanstack
        env:
          BASE_URL: 'http://localhost:3002'
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: apps/web-tanstack/playwright-report/
          retention-days: 7
