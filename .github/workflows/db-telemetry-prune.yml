name: DB Telemetry Prune

# Monthly retention job: deletes recommendation_events older than 90 days.
# Uses export-then-prune so click signals are exported to the ML training
# files before any rows are deleted (training data stays lossless).

on:
  schedule:
    # 1st of every month at 04:00 UTC
    - cron: '0 4 1 * *'
  workflow_dispatch: {}

concurrency:
  group: db-telemetry-prune
  cancel-in-progress: false

jobs:
  prune:
    name: Export signals + prune old telemetry
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=packages/db/prisma/schema

      - name: Export signals then prune events older than 90 days
        working-directory: tools/data-pipeline
        env:
          # Direct (unpooled) URL — long-running script, Neon pooler drops idle connections
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: node scripts/export-db-signals.mjs --prune-events-days=90 --verbose

      - name: Retrain ML models on fresh signals
        working-directory: tools/data-pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: npm run travel:ml:retrain-embeddings && npm run travel:ml:train-recommender
